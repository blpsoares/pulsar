# Config de DEMONSTRAÇÃO — usada nas gravações da TUI (docs/tape/*.tape).
# Aponta para os containers de teste do repositório (docker-compose-test.yml),
# nunca para um cluster real: nenhuma credencial mora aqui.
command:
  sync:
    source:
      uri: mongodb://127.0.0.1:27020/?replicaSet=rs0&directConnection=true
      db: loja
    destination:
      uri: mongodb://127.0.0.1:27021
      db: replica
    copyIndexes: true
    collections:
      - users
      - orders
      - pagamentos
